name: Policy & Research Radar

on:
  schedule:
    - cron: '0 8 * * 1' # Runs every Monday at 8 AM UTC
  workflow_dispatch:     # Run manually anytime from GitHub Actions tab

jobs:
  update-radar:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install feedparser

      - name: Run policy ingest script
        run: |
          python scripts/fetch_legal_news.py

      - name: Commit updates to radar
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add radar/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(radar): automated weekly energy policy digest" && git push)
