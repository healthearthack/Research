name: Propose Research Thesis Updates

on:
  schedule:
    - cron: '0 8 * * 1' # Runs every Monday at 8 AM UTC
  workflow_dispatch:     # Trigger manually anytime

jobs:
  propose-changes:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run research proposal agent
        run: |
          pip install feedparser
          python scripts/draft_thesis_amendment.py

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "feat(research): propose weekly policy-aligned thesis updates"
          title: "🤖 Research Agent: Proposed Thesis Updates Based on Recent Energy Policy"
          body: |
            ## Automated Research Proposal
            This Pull Request was generated by your automated policy radar.
            
            ### What Changed:
            * Integrated recent legal/market signals into `proposal/working_thesis.md`.
            * Proposed amendments to keep assumptions aligned with current grid policy.
            
            ### Required Action:
            1. Review the visual diff under **Files changed**.
            2. Request revisions or edit inline if necessary.
            3. Approve & merge, or close if outside your thesis scope.
          branch: "automated-thesis-updates"
          delete-branch: true
          labels: |
            research-radar
            needs-human-review
