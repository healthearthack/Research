name: Junior Researcher Agent

on:
  schedule:
    - cron: '0 6 * * 1' # Runs every Monday at 6 AM UTC
  workflow_dispatch:     # Allows 1-click manual trigger from GitHub Actions tab

jobs:
  research-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Junior Researcher Scanner
        run: |
          python scripts/junior_researcher.py

      - name: Commit and Push Intelligence Directly to Main
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add radar/
          git diff --staged --quiet || (git commit -m "🤖 chore(radar): autonomous weekly geoenergy & policy intelligence brief" && git push origin main)