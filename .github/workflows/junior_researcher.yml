name: Junior Researcher Agent

on:
  schedule:
    - cron: '0 6 * * 1' # Runs Mondays at 6:00 AM UTC
  workflow_dispatch:     # 1-click manual trigger

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE20: "true"

jobs:
  research-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Junior Researcher Scanner
        run: |
          python scripts/junior_researcher.py

      - name: Commit Intelligence Directly to Main
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add radar/
          git diff --staged --quiet || (git commit -m "🤖 chore(radar): automated weekly geoenergy intelligence brief" && git push origin main)